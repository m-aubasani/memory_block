model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"
  attn_implementation: "sdpa" # "sdpa" (PyTorch Scaled Dot-Product Attention) or "eager"

extraction:
  layers: [7, 10, 14, 18, 21]
  n_pairs: 150
  dataset_name: "PKU-Alignment/PKU-SafeRLHF"
  seed: 42

sweep:
  layers: [14] # subset of extraction.layers to actually eval
  modes: ["add", "rotate"]
  add_coefficients: [0.5, 1.0, 2.0, 4.0, 8.0]
  rotate_angles_deg: [10, 20, 30, 45, 60]

evaluation:
  adversarial_dataset: "jailbreakbench" # options: "jailbreakbench", "harmbench", "pku" (harmbench only has plain behavior text - not truly adversarial)
  benign_dataset: "xstest" # options: "xstest", "jailbreakbench", "pku"
  harmbench_url: "https://raw.githubusercontent.com/centerforaisafety/HarmBench/main/data/behavior_datasets/harmbench_behaviors_text_all.csv"
  # JailbreakBench transfer attacks: all 12 available method/source-model artifacts
  # (PAIR / GCG / prompt_with_random_search x vicuna-13b-v1.5, llama-2-7b-chat-hf,
  #  gpt-3.5-turbo-1106, gpt-4-0125-preview) + @template_goals template-wrapped goals.
  # Override with a list, e.g. [["PAIR", "vicuna-13b-v1.5", "black_box"]].
  jbb_artifact_combos: null
  template_goals: 100 # number of plain JBB goals wrapped with static jailbreak templates (100 goals x template_count = template_jailbreak prompts)
  template_count: 4 # how many of the JAILBREAK_TEMPLATES to use when wrapping each goal (4 = all framings: DAN/AIM/Dev-Mode/story; template-only run -> 100x4=400 prompts)
  # Attack-family filter: prefix-matches each prompt's `subset`. Default = top-5
  # diverse families (~500 adversarial prompts: 4 JBB artifact families ~100 each
  # + template_jailbreak = template_goals x template_count). Set `null` to keep ALL families.
  # Template-only run: ["template_jailbreak"] with max_per_family: 400 -> exactly 400 template-wrapped prompts.
  attack_family_filter: ["jbb_GCG_vicuna-13b-v1.5", "jbb_GCG_gpt-4-0125-preview", "jbb_prompt_with_random_search_gpt-4-0125-preview", "jbb_prompt_with_random_search_llama-2-7b-chat-hf", "template_jailbreak"]
  max_per_family: 400 # per-family cap for the attack-family filter (must be >= template_goals x template_count when template_jailbreak is the only family)
  num_samples: null # null for full benchmark (filtered families when attack_family_filter is set)
  batch_size: 32 # increased batch size for batched generation speedup
  classifier_batch_size: 64 # legacy: GLiGuard/Refusal batch size (kept for compat, use wildguard_batch_size)
  wildguard_batch_size: 8 # WildGuard (7B) batch size - keep small for T4 15GB (OOM prevention)
  wildguard_max_new_tokens: 32 # WildGuard generation length (parsing only needs short answer)
  max_new_tokens: 60 # 60 tokens for fast exploratory sweep (enough for refusal detection)
  constitution_path: "constitution.txt"
  eval_cache_dir: "steering/eval_cache"
  # WildGuard unified safety & refusal checker (replaces GLiGuard + RefusalChecker)
  wildguard_model: "allenai/wildguard"
  wildguard_dtype: "bfloat16" # bfloat16 preferred on T4; fallback float16
  wildguard_tmp_path: "steering/results/tmp_generations.json" # intermediate save for two-phase VRAM purge
  # Legacy (deprecated) — kept for backward compat, ignored when wildguard_model is set
  refusal_classifier_model: "allenai/wildguard"
  guard_model: "allenai/wildguard"
  filter_eval_with_guard: false # false for standard benchmarks like JBB / HarmBench / XSTest
  bootstrap_iterations: 1000
  bootstrap_seed: 42
  results_csv_path: "steering/results/sweep_results.csv"

wandb:
  enabled: true
  project: "memory-block-alignment-caa"
  entity: "mr_letters-personal"
  run_name: "caa-steering-sweep"
  mode: "online" # options: "online", "offline", "disabled"
  tags:
    - "steering-vector"
    - "caa"
    - "jailbreakbench"
    - "xstest"
    - "harmbench"
    - "ai-alignment"
