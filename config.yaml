model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  extraction_layers:
    - 14
  injection_layers:
    - 14
  num_encoder_layers: 0
  num_heads: 8
  dtype: "bfloat16"

data:
  dataset_name: "PKU-Alignment/PKU-SafeRLHF"
  constitution_path: "constitution.txt"
  train_max_samples: 4000
  max_seq_length: 256
  max_memory_length: 128
  seed: 42
  filter_refusal_only: false # optional: only train on safe responses that are explicit refusals
  refusal_filter_batch_size: 64 # batch size for refusal check filtering
  filter_eval_with_guard: true # filter evaluation input prompts with GLiGuard
  guard_filter_batch_size: 64

training:
  batch_size: 8
  learning_rate: 0.0003
  gate_learning_rate: 0.0003
  epochs: 2
  log_interval: 20

evaluation:
  num_samples: 1000
  batch_size: 64
  max_new_tokens: 100
  seed: 42
  refusal_classifier_model: "natong19/refusal_classifier"
  guard_model: "fastino/gliguard-LLMGuardrails-300M"
  output_adversarial_csv_path: "alignment_eval_adversarial_results.csv"
  output_safe_csv_path: "alignment_eval_safe_results.csv"

wandb:
  enabled: true
  project: "memory-block-alignment"
  entity: "mr_letters-personal"
  run_name: "encd-0-ex-14-inj-14-exp"
  mode: "online" # options: "online", "offline", "disabled"
  tags:
    - "axiomatic-injection"
    - "ai-alignment"

